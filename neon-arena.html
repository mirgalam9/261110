<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Neon Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
  canvas{display:block;width:100vw;height:100vh;cursor:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/* =====================================================================
   NEON ARENA — 트윈스틱 아레나 서바이벌 (단일 파일)
   ===================================================================== */
const cvs = document.getElementById('c'), ctx = cvs.getContext('2d');
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
const ease = {
  outCubic: t => 1 - Math.pow(1 - t, 3),
  outBack: t => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
  outElastic: t => t <= 0 ? 0 : t >= 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (TAU / 3)) + 1,
};
const angDiff = (a, b) => ((b - a + Math.PI) % TAU + TAU) % TAU - Math.PI;
const FD = '"Orbitron","Segoe UI",sans-serif';
const FK = '"Black Han Sans","Malgun Gothic","Apple SD Gothic Neo",sans-serif';

const AW = 2400, AH = 1500;
let SW, SH, DPR, K, VW, VH;
function resize() {
  DPR = Math.min(2, devicePixelRatio || 1); SW = innerWidth; SH = innerHeight;
  cvs.width = Math.round(SW * DPR); cvs.height = Math.round(SH * DPR);
  K = clamp(Math.min(SW / 1150, SH / 740), 0.42, 1.5); VW = SW / K; VH = SH / K;
}

/* ---------- 글로우 스프라이트 ---------- */
const GLOW = {};
function glowSpr(col) {
  let c = GLOW[col]; if (c) return c;
  c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.2, col); gr.addColorStop(0.5, col + '44'); gr.addColorStop(1, col + '00');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64); return GLOW[col] = c;
}
function glow(x, y, r, col, a = 1) { ctx.globalAlpha = a; ctx.drawImage(glowSpr(col), x - r, y - r, r * 2, r * 2); }

/* ---------- 휘어지는 그리드 (스프링 메시) ---------- */
const GS = 50, GC = AW / GS + 1, GR = AH / GS + 1, GN = GC * GR;
const gx = new Float32Array(GN), gy = new Float32Array(GN), gvx = new Float32Array(GN), gvy = new Float32Array(GN);
for (let j = 0; j < GR; j++) for (let i = 0; i < GC; i++) { gx[j * GC + i] = i * GS; gy[j * GC + i] = j * GS; }
function gridForce(x, y, R, str) {
  const c0 = Math.max(1, Math.floor((x - R) / GS)), c1 = Math.min(GC - 2, Math.ceil((x + R) / GS));
  const r0 = Math.max(1, Math.floor((y - R) / GS)), r1 = Math.min(GR - 2, Math.ceil((y + R) / GS));
  for (let j = r0; j <= r1; j++) for (let i = c0; i <= c1; i++) {
    const k = j * GC + i, dx = gx[k] - x, dy = gy[k] - y, d = Math.hypot(dx, dy);
    if (d < R && d > 0.1) { const f = str * (1 - d / R); gvx[k] += dx / d * f; gvy[k] += dy / d * f; }
  }
}
function updGrid(dt) {
  const damp = Math.pow(0.04, dt);
  for (let j = 1; j < GR - 1; j++) for (let i = 1; i < GC - 1; i++) {
    const k = j * GC + i, rx = i * GS, ry = j * GS;
    const lx = (gx[k - 1] + gx[k + 1] + gx[k - GC] + gx[k + GC]) * 0.25 - gx[k];
    const ly = (gy[k - 1] + gy[k + 1] + gy[k - GC] + gy[k + GC]) * 0.25 - gy[k];
    gvx[k] = (gvx[k] + ((rx - gx[k]) * 26 + lx * 90) * dt) * damp;
    gvy[k] = (gvy[k] + ((ry - gy[k]) * 26 + ly * 90) * dt) * damp;
  }
  for (let k = 0; k < GN; k++) { gx[k] += gvx[k] * dt; gy[k] += gvy[k] * dt; }
}
function drawGrid() {
  const hue = (200 + level * 35) % 360;
  for (let pass = 0; pass < 2; pass++) {
    ctx.strokeStyle = pass ? `hsl(${hue},100%,62%)` : `hsl(${hue},90%,45%)`;
    ctx.lineWidth = pass ? 1.6 : 1;
    ctx.globalAlpha = pass ? 0.5 : 0.22;
    ctx.beginPath();
    for (let j = 0; j < GR; j++) {
      if ((j % 4 === 0) !== !!pass) continue;
      ctx.moveTo(gx[j * GC], gy[j * GC]);
      for (let i = 1; i < GC; i++) ctx.lineTo(gx[j * GC + i], gy[j * GC + i]);
    }
    for (let i = 0; i < GC; i++) {
      if ((i % 4 === 0) !== !!pass) continue;
      ctx.moveTo(gx[i], gy[i]);
      for (let j = 1; j < GR; j++) ctx.lineTo(gx[j * GC + i], gy[j * GC + i]);
    }
    ctx.stroke();
  }
  // 경계 벽
  const p = 0.6 + Math.sin(gtime * 3) * 0.2;
  ctx.globalAlpha = p; ctx.strokeStyle = `hsl(${hue + 120},100%,65%)`; ctx.lineWidth = 4; ctx.strokeRect(0, 0, AW, AH);
  ctx.globalAlpha = p * 0.3; ctx.lineWidth = 14; ctx.strokeRect(0, 0, AW, AH);
  ctx.globalAlpha = 1;
}

/* ---------- 오디오 ---------- */
let AC = null, master, sfxG, musG, NOISE, muted = false, nextNoteT = 0, stepI = 0;
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.5; master.connect(AC.destination);
    sfxG = AC.createGain(); sfxG.gain.value = 0.8; sfxG.connect(master);
    musG = AC.createGain(); musG.gain.value = 0.3; musG.connect(master);
    NOISE = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
    const d = NOISE.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    nextNoteT = AC.currentTime + 0.1; setInterval(music, 25);
  } catch (e) { AC = null; }
}
function tone(f, dur, type = 'square', vol = 0.1, slide = 1, delay = 0, out) {
  if (!AC || muted) return; const t = AC.currentTime + Math.max(0, delay);
  const o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide !== 1) o.frequency.exponentialRampToValueAtTime(Math.max(20, f * slide), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(out || sfxG); o.start(t); o.stop(t + dur + 0.05);
}
function noise(dur, vol, f0, f1, delay = 0, type = 'lowpass', out) {
  if (!AC || muted) return; const t = AC.currentTime + Math.max(0, delay);
  const s = AC.createBufferSource(); s.buffer = NOISE; const f = AC.createBiquadFilter(); f.type = type;
  f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
  const g = AC.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(out || sfxG); s.start(t, Math.random()); s.stop(t + dur + 0.05);
}
const lastS = {};
const thr = (k, ms) => { const n = performance.now(); if (lastS[k] && n - lastS[k] < ms) return false; lastS[k] = n; return true; };
const SFX = {
  shot() { if (thr('s', 80)) tone(900, 0.05, 'square', 0.02, 0.5); },
  pop() { if (thr('p', 35)) { noise(0.25, 0.2, 3000, 200); tone(rand(300, 500), 0.15, 'triangle', 0.08, 0.3); } },
  big() { noise(1.0, 0.5, 2000, 40); tone(80, 0.8, 'sine', 0.4, 0.3); },
  geom() { if (thr('g', 25)) tone(1200 + Math.min(40, mult) * 30, 0.06, 'sine', 0.05); },
  dash() { noise(0.25, 0.12, 500, 5000, 0, 'bandpass'); tone(300, 0.2, 'sawtooth', 0.04, 3); },
  nova() { noise(1.5, 0.6, 400, 40); tone(60, 1.4, 'sawtooth', 0.25, 0.4); tone(1500, 1, 'sine', 0.08, 0.1); },
  die() { noise(1.6, 0.7, 2500, 30); tone(200, 1.4, 'sawtooth', 0.25, 0.1); },
  spawn() { if (thr('sp', 90)) tone(rand(200, 260), 0.25, 'sine', 0.03, 2); },
  charge() { if (thr('ch', 120)) tone(400, 0.5, 'sawtooth', 0.025, 3); },
  level() { [440, 554, 659, 880].forEach((f, i) => tone(f, 0.25, 'square', 0.06, 1, i * 0.09)); },
  hole() { if (thr('h', 400)) tone(55, 0.6, 'sine', 0.12, 0.8); },
};
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
function music() {
  if (!AC) return;
  const spb = 60 / 128 / 4;
  while (nextNoteT < AC.currentTime + 0.15) {
    const t = nextNoteT, s = stepI, i = s & 15, bar = (s >> 4) & 3, d = t - AC.currentTime;
    if (!muted && state !== 'over') {
      const roots = [38, 41, 36, 43], r = roots[bar];
      if (i % 4 === 0) { const o = AC.createOscillator(), g = AC.createGain(); o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.2); g.gain.setValueAtTime(0.8, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.22); o.connect(g); g.connect(musG); o.start(t); o.stop(t + 0.25); }
      if (i % 4 === 2) noise(0.05, 0.1, 9000, 7000, d, 'highpass', musG);
      if (i === 4 || i === 12) noise(0.18, 0.22, 3000, 900, d, 'bandpass', musG);
      tone(mtof(r + (i % 2 ? 12 : 0)), 0.12, 'sawtooth', 0.06, 1, d, musG);
      const arp = [0, 3, 7, 10, 12, 10, 7, 3];
      if (state === 'play' && level >= 2) tone(mtof(r + 24 + arp[i % 8]), 0.1, 'square', 0.025, 1, d, musG);
    }
    nextNoteT += spb; stepI = (stepI + 1) % 64;
  }
}

/* ---------- 입력 ---------- */
const keys = {}; const mouse = { x: 0, y: 0, down: false };
let isTouch = false, stick = null, mouseActive = false;
addEventListener('keydown', e => {
  initAudio();
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab'].includes(e.code)) e.preventDefault();
  keys[e.code] = true; if (e.repeat) return;
  if (e.code === 'KeyM') { muted = !muted; if (master) master.gain.value = muted ? 0 : 0.5; return; }
  if (state === 'title') { if (e.code === 'Enter' || e.code === 'Space') startGame(); return; }
  if (state === 'over') { if ((e.code === 'Enter' || e.code === 'Space') && overT > 1.2) startGame(); return; }
  if (e.code === 'KeyP' || e.code === 'Escape') { paused = !paused; return; }
  if (paused) { paused = false; return; }
  if (e.code === 'Space' || e.code === 'ShiftLeft' || e.code === 'ShiftRight') doDash();
  if (e.code === 'KeyQ' || e.code === 'KeyE') doNova();
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; mouse.down = false; if (state === 'play') paused = true; });
const dashBtn = () => ({ x: VW - 80, y: VH - 170 }), novaBtn = () => ({ x: VW - 180, y: VH - 90 });
cvs.addEventListener('pointerdown', e => {
  initAudio();
  const sx = e.clientX / K, sy = e.clientY / K;
  if (e.pointerType === 'touch') isTouch = true;
  if (state === 'title') { startGame(); return; }
  if (state === 'over') { if (overT > 1.2) startGame(); return; }
  if (paused) { paused = false; return; }
  if (e.pointerType === 'touch') {
    const db = dashBtn(), nb = novaBtn();
    if (dist(sx, sy, db.x, db.y) < 55) { doDash(); return; }
    if (dist(sx, sy, nb.x, nb.y) < 50) { doNova(); return; }
    if (!stick) stick = { id: e.pointerId, ox: sx, oy: sy, x: sx, y: sy };
  } else {
    mouse.x = sx; mouse.y = sy; mouseActive = true;
    if (e.button === 2) doNova(); else mouse.down = true;
  }
});
cvs.addEventListener('pointermove', e => {
  const sx = e.clientX / K, sy = e.clientY / K;
  if (e.pointerType === 'touch') { if (stick && stick.id === e.pointerId) { stick.x = sx; stick.y = sy; } }
  else { mouse.x = sx; mouse.y = sy; mouseActive = true; }
});
const pUp = e => { if (stick && stick.id === e.pointerId) stick = null; if (e.pointerType !== 'touch' && e.button !== 2) mouse.down = false; };
cvs.addEventListener('pointerup', pUp); cvs.addEventListener('pointercancel', pUp);
cvs.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') paused = true; });

/* ---------- 상태 ---------- */
let state = 'title', paused = false, gtime = 0, titleT = 0, overT = 0;
let player, bullets = [], ebullets = [], enemies = [], spawns = [], geoms = [], parts = [], texts = [], banners = [];
let score = 0, dispScore = 0, hiScore = 0, mult = 1, multPop = 0, lives = 3, novas = 3, level = 1, levelT = 0, runT = 0, kills = 0, bestMult = 1, newRecord = false;
let spawnT = 1, shake = 0, zoom = 1, zoomKick = 0, flashA = 0, flashCol = '#fff', freeze = 0, timeScale = 1, slowT = 0, slowV = 1, novaWave = null, respawnT = 0, chain = [];
const cam = { x: AW / 2, y: AH / 2 };
try { hiScore = +localStorage.getItem('neonarena_hi') || 0; } catch (e) {}
const stars = Array.from({ length: 180 }, () => ({ x: Math.random() * 4000, y: Math.random() * 3000, z: rand(0.1, 0.5), s: rand(0.5, 1.8) }));

function startGame() {
  state = 'play'; paused = false;
  player = { x: AW / 2, y: AH / 2, vx: 0, vy: 0, ang: -Math.PI / 2, r: 12, fireT: 0, dashT: 0, dashCd: 0, dashVx: 0, dashVy: 0, inv: 2, dead: false, ghostT: 0, thrT: 0, spawnT: 0 };
  bullets = []; ebullets = []; enemies = []; spawns = []; geoms = []; parts = []; texts = []; banners = []; chain = [];
  score = 0; dispScore = 0; mult = 1; lives = 3; novas = 3; level = 1; levelT = 0; runT = 0; kills = 0; bestMult = 1; newRecord = false;
  spawnT = 1.5; novaWave = null; respawnT = 0; flashA = 0.6; flashCol = '#ffffff';
  cam.x = player.x; cam.y = player.y;
  gridForce(player.x, player.y, 600, 900);
  banners.push({ type: 'level', t: 0, dur: 2.4, n: 1 });
  SFX.level();
}

/* ---------- 파티클 ---------- */
function addP(o) { if (parts.length > 2600) return; o.max = o.life; o.vx = o.vx || 0; o.vy = o.vy || 0; o.drag = o.drag || 0; if (o.a == null) o.a = 1; parts.push(o); }
function sparks(x, y, n, col, spd = 500, life = 0.5, ang = null, spread = TAU) {
  for (let i = 0; i < n; i++) { const a = ang == null ? Math.random() * TAU : ang + rand(-spread / 2, spread / 2), s = rand(spd * 0.3, spd); addP({ k: 'spark', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(life * 0.5, life), size: rand(1.5, 3), color: col, drag: 3 }); }
}
function burst(x, y, col, sz = 1) {
  addP({ k: 'glow', x, y, size: 60 * sz, life: 0.25, color: col });
  addP({ k: 'ring', x, y, size: 6, grow: 70 * sz, life: 0.4, color: col, w: 4 });
  sparks(x, y, Math.round(22 * sz), col, 650 * Math.sqrt(sz), 0.7);
  sparks(x, y, Math.round(8 * sz), '#ffffff', 400, 0.4);
  for (let i = 0; i < 5 * sz; i++) { const a = Math.random() * TAU; addP({ k: 'shard', x, y, vx: Math.cos(a) * rand(100, 350), vy: Math.sin(a) * rand(100, 350), life: rand(0.5, 1), size: rand(4, 9), color: col, rot: Math.random() * TAU, vr: rand(-15, 15), drag: 2 }); }
  gridForce(x, y, 160 * Math.sqrt(sz), 260 * sz);
  shake = Math.max(shake, 3 * sz);
}
function addText(x, y, s, col = '#fff', size = 16, dur = 0.8) { texts.push({ x, y, s, col, size, t: 0, dur }); }

/* ---------- 적 ---------- */
const ED = {
  wander: { r: 16, hp: 1, col: '#ff4fd8', score: 50, spd: 95 },
  chaser: { r: 15, hp: 2, col: '#5cff8a', score: 100, spd: 270 },
  splitter: { r: 21, hp: 4, col: '#b06cff', score: 150, spd: 120 },
  mini: { r: 9, hp: 1, col: '#e0b0ff', score: 30, spd: 330 },
  sniper: { r: 17, hp: 3, col: '#ffa63d', score: 220, spd: 160 },
  hole: { r: 28, hp: 22, col: '#ff3b5c', score: 800, spd: 35 },
};
function queueSpawn(type, x, y, delay = 0) {
  x = clamp(x, 40, AW - 40); y = clamp(y, 40, AH - 40);
  if (player && dist(x, y, player.x, player.y) < 220) { const a = Math.atan2(y - player.y, x - player.x) || rand(0, TAU); x = clamp(player.x + Math.cos(a) * 260, 40, AW - 40); y = clamp(player.y + Math.sin(a) * 260, 40, AH - 40); }
  spawns.push({ type, x, y, t: -delay, dur: 0.85 });
}
function makeEnemy(type, x, y) {
  const d = ED[type];
  const e = { type, x, y, vx: 0, vy: 0, r: d.r, hp: d.hp + (type === 'hole' ? level * 2 : 0), col: d.col, score: d.score, spd: d.spd * (1 + level * 0.04), t: 0, rot: Math.random() * TAU, wa: Math.random() * TAU, fireT: rand(1.5, 3), charge: 0, flash: 0 };
  e.max = e.hp; enemies.push(e); return e;
}
function director(dt) {
  levelT += dt; runT += dt;
  if (levelT > 32) { level++; levelT = 0; banners.push({ type: 'level', t: 0, dur: 2.4, n: level }); SFX.level(); gridForce(player.x, player.y, 900, 500); }
  spawnT -= dt;
  if (spawnT > 0 || respawnT > 0) return;
  spawnT = Math.max(0.55, 2.6 - level * 0.22) * rand(0.8, 1.2);
  if (enemies.length + spawns.length > 70 + level * 10) return;
  const opts = [['scatter', 3], ['corners', level >= 2 ? 1.5 : 0.5], ['ring', level >= 2 ? 1.2 : 0], ['snipers', level >= 2 ? 1.2 : 0.3], ['split', 1.3], ['hole', level >= 3 && enemies.filter(e => e.type === 'hole').length < 2 ? 0.6 : 0], ['stream', 1]];
  let tot = opts.reduce((s, o) => s + o[1], 0), r = Math.random() * tot, pick = 'scatter';
  for (const o of opts) { r -= o[1]; if (r <= 0) { pick = o[0]; break; } }
  const p = player;
  if (pick === 'scatter') { const n = 3 + level; for (let i = 0; i < n; i++) queueSpawn(Math.random() < 0.5 + level * 0.05 ? 'chaser' : 'wander', rand(60, AW - 60), rand(60, AH - 60), i * 0.06); }
  else if (pick === 'corners') { const c = [[80, 80], [AW - 80, 80], [80, AH - 80], [AW - 80, AH - 80]]; const tp = Math.random() < .5 ? 'wander' : 'chaser'; c.forEach(([x, y]) => { for (let i = 0; i < 3 + Math.floor(level / 2); i++) queueSpawn(tp, x + rand(-50, 50), y + rand(-50, 50), i * 0.08); }); }
  else if (pick === 'ring') { const n = 8 + level, R = 420; for (let i = 0; i < n; i++) { const a = i / n * TAU; queueSpawn('chaser', p.x + Math.cos(a) * R, p.y + Math.sin(a) * R, i * 0.03); } }
  else if (pick === 'snipers') { for (let i = 0; i < 1 + Math.floor(level / 2); i++) queueSpawn('sniper', rand(80, AW - 80), rand(80, AH - 80), i * 0.2); }
  else if (pick === 'split') { for (let i = 0; i < 1 + Math.floor(level / 2); i++) queueSpawn('splitter', rand(80, AW - 80), rand(80, AH - 80), i * 0.2); }
  else if (pick === 'hole') queueSpawn('hole', rand(300, AW - 300), rand(300, AH - 300));
  else if (pick === 'stream') { const side = (Math.random() * 4) | 0; for (let i = 0; i < 6 + level; i++) { const t = rand(0.1, 0.9); const pos = [[t * AW, 60], [AW - 60, t * AH], [t * AW, AH - 60], [60, t * AH]][side]; queueSpawn('wander', pos[0], pos[1], i * 0.12); } }
}

/* ---------- 플레이어 액션 ---------- */
function moveInput() {
  let ix = 0, iy = 0;
  if (keys.KeyA || keys.ArrowLeft) ix--; if (keys.KeyD || keys.ArrowRight) ix++;
  if (keys.KeyW || keys.ArrowUp) iy--; if (keys.KeyS || keys.ArrowDown) iy++;
  if (stick) { const dx = stick.x - stick.ox, dy = stick.y - stick.oy, l = Math.hypot(dx, dy); if (l > 6) { const m = Math.min(1, l / 60); ix = dx / l * m; iy = dy / l * m; } }
  const l = Math.hypot(ix, iy); if (l > 1) { ix /= l; iy /= l; }
  return [ix, iy];
}
function doDash() {
  const p = player; if (!p || p.dead || p.dashCd > 0) return;
  let [ix, iy] = moveInput();
  if (!ix && !iy) { ix = Math.cos(p.ang); iy = Math.sin(p.ang); }
  const l = Math.hypot(ix, iy); p.dashVx = ix / l * 1400; p.dashVy = iy / l * 1400;

/* ---------- 루프 ---------- */
let last = performance.now();

<script>(()=>{const b=document.getElementById("menuBtn");const vis=()=>{const s=state!=="play"||paused;b.style.opacity=s?1:0;b.style.pointerEvents=s?"auto":"none"};setInterval(vis,150);vis();addEventListener("keydown",e=>{if(e.code==="Backspace"&&(state!=="play"||paused))location.href="index.html"})})();</script>
</body>
</html>
