<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Storm Wing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
  canvas{display:block;width:100vw;height:100vh;cursor:crosshair}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/* =====================================================================
   STORM WING — 다이나믹 비행 슈팅 게임 (단일 파일, 외부 에셋 없음)
   ===================================================================== */
const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d');
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
const ease = {
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inCubic: t => t * t * t,
  outBack: t => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
  outElastic: t => t <= 0 ? 0 : t >= 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (TAU / 3)) + 1,
  inOut: t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2,
};
function angDiff(a, b) { return ((b - a + Math.PI) % TAU + TAU) % TAU - Math.PI; }
function turnTo(a, b, max) { return a + clamp(angDiff(a, b), -max, max); }
const FD = '"Orbitron","Segoe UI",sans-serif';
const FK = '"Black Han Sans","Malgun Gothic","Apple SD Gothic Neo",sans-serif';

/* ---------------- 화면 / 스케일 ---------------- */
let SW, SH, DPR, K, VW, VH;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  SW = innerWidth; SH = innerHeight;
  cvs.width = Math.round(SW * DPR); cvs.height = Math.round(SH * DPR);
  K = clamp(Math.min(SW / 560, SH / 860), 0.45, 1.6);
  VW = SW / K; VH = SH / K;
  buildTerrain();
  initClouds();
}

/* ---------------- 스프라이트 캐시 ---------------- */
const GLOW = {};
function glowSpr(col) {
  let c = GLOW[col]; if (c) return c;
  c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(255,255,255,1)');
  gr.addColorStop(0.18, col);
  gr.addColorStop(0.5, col + '55');
  gr.addColorStop(1, col + '00');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  return GLOW[col] = c;
}
function soft(r, g, b) {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const x = c.getContext('2d');
  const gr = x.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, `rgba(${r},${g},${b},1)`);
  gr.addColorStop(0.5, `rgba(${r},${g},${b},0.45)`);
  gr.addColorStop(1, `rgba(${r},${g},${b},0)`);
  x.fillStyle = gr; x.fillRect(0, 0, 64, 64);
  return c;
}
const SMOKE_D = soft(48, 44, 50), SMOKE_L = soft(255, 255, 255);
function glow(x, y, r, col, a = 1) { ctx.globalAlpha = a; ctx.drawImage(glowSpr(col), x - r, y - r, r * 2, r * 2); }

const cloudSpr = [], cloudShadow = [];
(function makeClouds() {
  for (let k = 0; k < 6; k++) {
    const c = document.createElement('canvas'); c.width = 320; c.height = 200;
    const g = c.getContext('2d');
    const n = 18 + (k * 3) % 9;
    for (let i = 0; i < n; i++) {
      const x = rand(80, 240), y = rand(75, 120) + Math.abs(x - 160) / 8, r = rand(26, 58);
      const gr = g.createRadialGradient(x, y - r * 0.2, 0, x, y, r);
      gr.addColorStop(0, 'rgba(255,255,255,0.95)');
      gr.addColorStop(0.55, 'rgba(240,246,255,0.55)');
      gr.addColorStop(1, 'rgba(220,230,250,0)');
      g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
    }
    cloudSpr.push(c);
    const s = document.createElement('canvas'); s.width = 320; s.height = 200;
    const sg = s.getContext('2d'); sg.drawImage(c, 0, 0);
    sg.globalCompositeOperation = 'source-in'; sg.fillStyle = '#001020'; sg.fillRect(0, 0, 320, 200);
    cloudShadow.push(s);
  }
})();

/* ---------------- 스테이지 테마 / 지형 ---------------- */
const THEMES = [
  { name: '푸른 군도', en: 'AZURE ARCHIPELAGO', base: ['#0d5a86', '#0a456b'], shallow: '#2fa3c4', sand: '#ead7a0', land: ['#3f8f4a', '#2f6e3a', '#62b25e'], haze: '#bfe8ff', mode: 'sea', sun: true, cloudA: 1 },
  { name: '황혼의 사막', en: 'DUSK DESERT', base: ['#c98242', '#a9612e'], shallow: '#e3a25e', sand: '#f0c283', land: ['#8a4420', '#a85a2a', '#6e341a'], haze: '#ffb07a', mode: 'desert', sun: true, cloudA: 0.6 },
  { name: '네온 메트로폴리스', en: 'NEON METROPOLIS', base: ['#0a0d22', '#070a1a'], shallow: '#141a3a', sand: '#1d2346', land: ['#141a3a', '#1b2250', '#232b60'], haze: '#7a5cff', mode: 'city', sun: false, cloudA: 0.35 },
  { name: '빙하 전선', en: 'GLACIER FRONT', base: ['#2f6584', '#244e6a'], shallow: '#5aa0c4', sand: '#d8ecf8', land: ['#e9f5ff', '#c9e2f2', '#ffffff'], haze: '#e0f4ff', mode: 'sea', sun: true, cloudA: 0.9 },
];
const BOSSES = [['LEVIATHAN', '리바이어선'], ['SCORPION', '스콜피온'], ['NIGHTMARE', '나이트메어'], ['GLACIOS', '글라시오스']];
const theme = () => THEMES[(stage - 1) % THEMES.length];
const TH = 1700;
let terr = null, terrOld = null, terrFade = 0, terrScroll = 0;

function buildTerrain() {
  const th = theme();
  const w = Math.ceil(VW + 120);
  const c = document.createElement('canvas'); c.width = w; c.height = TH;
  const g = c.getContext('2d');
  const wrap = fn => { fn(0); fn(-TH); fn(TH); };
  g.fillStyle = th.base[0]; g.fillRect(0, 0, w, TH);
  // 얼룩 노이즈
  for (let i = 0; i < 220; i++) {
    const x = Math.random() * w, y = Math.random() * TH, r = rand(40, 160);
    wrap(o => { const gr = g.createRadialGradient(x, y + o, 0, x, y + o, r); gr.addColorStop(0, th.base[1] + 'aa'); gr.addColorStop(1, th.base[1] + '00'); g.fillStyle = gr; g.fillRect(x - r, y + o - r, r * 2, r * 2); });
  }
  if (th.mode === 'city') {
    // 도시 블록 + 네온 도로
    const bs = 70;
    for (let y = 0; y < TH; y += bs) for (let x = 0; x < w; x += bs) {
      if (Math.random() < 0.12) continue;
      g.fillStyle = th.land[(Math.random() * 3) | 0];
      const pad = 8; g.fillRect(x + pad, y + pad, bs - pad * 2, bs - pad * 2);
      for (let k = 0; k < 10; k++) {
        g.fillStyle = Math.random() < .7 ? 'rgba(255,214,120,0.8)' : 'rgba(120,220,255,0.8)';
        g.fillRect(x + pad + 3 + Math.random() * (bs - pad * 2 - 6), y + pad + 3 + Math.random() * (bs - pad * 2 - 6), 2, 2);
      }
    }
    for (let x = 0; x < w; x += bs * 3) { g.fillStyle = 'rgba(255,60,200,0.35)'; g.fillRect(x - 2, 0, 4, TH); }
    for (let y = 0; y < TH; y += bs * 4) { g.fillStyle = 'rgba(60,220,255,0.35)'; g.fillRect(0, y - 2, w, 4); }
  } else {
    // 섬 / 바위 / 빙하
    const N = th.mode === 'desert' ? 22 : 15;
    for (let i = 0; i < N; i++) {
      const cx = Math.random() * w, cy = Math.random() * TH, R = rand(40, 140);
      const blobs = [];
      for (let k = 0; k < 10; k++) blobs.push([cx + rand(-R, R) * 0.8, cy + rand(-R, R) * 0.8, rand(R * 0.35, R * 0.7)]);
      const layer = (col, extra) => wrap(o => { g.fillStyle = col; blobs.forEach(b => { g.beginPath(); g.arc(b[0], b[1] + o, Math.max(2, b[2] + extra), 0, TAU); g.fill(); }); });
      if (th.mode === 'sea') { layer(th.shallow + '66', 26); layer(th.shallow + 'aa', 14); layer(th.sand, 6); }
      else layer(th.base[1], 10);
      layer(th.land[0], 0);
      for (let k = 0; k < 14; k++) { // 지형 디테일
        const b = blobs[(Math.random() * blobs.length) | 0], a = Math.random() * TAU, d = Math.random() * b[2] * 0.6, rr = rand(4, b[2] * 0.35);
        wrap(o => { const gx = b[0] + Math.cos(a) * d, gy = b[1] + Math.sin(a) * d + o; const gr = g.createRadialGradient(gx, gy, 0, gx, gy, rr); gr.addColorStop(0, th.land[k % 2 ? 1 : 2] + 'cc'); gr.addColorStop(1, th.land[k % 2 ? 1 : 2] + '00'); g.fillStyle = gr; g.fillRect(gx - rr, gy - rr, rr * 2, rr * 2); });
      }
    }
    if (th.mode === 'sea') {
      for (let i = 0; i < 500; i++) { g.fillStyle = 'rgba(255,255,255,' + rand(0.05, 0.22) + ')'; g.fillRect(Math.random() * w, Math.random() * TH, rand(4, 14), 1.5); }
    } else {
      g.strokeStyle = 'rgba(80,30,10,0.25)'; g.lineWidth = 2;
      for (let i = 0; i < 70; i++) { const x = Math.random() * w, y = Math.random() * TH; g.beginPath(); g.moveTo(x, y); g.bezierCurveTo(x + 40, y - 20, x + 80, y + 20, x + 130, y); g.stroke(); }
    }
  }
  terr = c;
}

/* ---------------- 구름 / 속도선 ---------------- */
let clouds = [], lines = [];
function newCloud(layer, y) {
  const s = layer ? rand(2.2, 3.4) : rand(0.8, 1.5);
  return { layer, x: rand(-100, VW + 100), y: y != null ? y : -200 * s - rand(0, 400), s, spr: (Math.random() * cloudSpr.length) | 0, sp: layer ? rand(560, 720) : rand(130, 190), flip: Math.random() < .5 };
}
function initClouds() {
  clouds = [];
  for (let i = 0; i < 8; i++) clouds.push(newCloud(0, rand(-200, VH)));
  for (let i = 0; i < 2; i++) clouds.push(newCloud(1, rand(-1200, -200)));
  lines = [];
  for (let i = 0; i < 46; i++) lines.push({ x: rand(0, VW), y: rand(0, VH), len: rand(40, 140), sp: rand(1100, 1900), a: rand(0.05, 0.22) });
}

/* ---------------- 오디오 (WebAudio 합성) ---------------- */
let AC = null, master = null, musicGain = null, sfxGain = null, NOISE = null, muted = false, intense = false;
let nextNoteT = 0, stepI = 0;
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.55; master.connect(AC.destination);
    musicGain = AC.createGain(); musicGain.gain.value = 0.32; musicGain.connect(master);
    sfxGain = AC.createGain(); sfxGain.gain.value = 0.8; sfxGain.connect(master);
    NOISE = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
    const d = NOISE.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    nextNoteT = AC.currentTime + 0.1;
    setInterval(scheduleMusic, 25);
  } catch (e) { AC = null; }
}
function tone(f, dur, type = 'square', vol = 0.1, slide = 1, delay = 0, out) {
  if (!AC || muted) return;
  const t = AC.currentTime + delay;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide !== 1) o.frequency.exponentialRampToValueAtTime(Math.max(20, f * slide), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(out || sfxGain); o.start(t); o.stop(t + dur + 0.05);
}
function noise(dur, vol, f0, f1, delay = 0, type = 'lowpass', out) {
  if (!AC || muted) return;
  const t = AC.currentTime + delay;
  const s = AC.createBufferSource(); s.buffer = NOISE;
  const f = AC.createBiquadFilter(); f.type = type; f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
  const g = AC.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(out || sfxGain); s.start(t, Math.random()); s.stop(t + dur + 0.05);
}
const lastS = {};
function throttle(k, gap) { const n = performance.now(); if (lastS[k] && n - lastS[k] < gap) return false; lastS[k] = n; return true; }
const SFX = {
  shot() { if (throttle('shot', 70)) tone(1500, 0.05, 'square', 0.018, 0.4); },
  missile() { if (throttle('mis', 200)) noise(0.25, 0.05, 3000, 600, 0, 'bandpass'); },
  hit() { if (throttle('hit', 45)) tone(2200, 0.03, 'triangle', 0.035, 0.6); },
  boom(sz) {
    if (!throttle('boom' + (sz > 2 ? 'b' : 's'), sz > 2 ? 80 : 40)) return;
    noise(0.3 + sz * 0.25, Math.min(0.6, 0.18 + sz * 0.1), 2500, 60);
    tone(140, 0.25 + sz * 0.15, 'sine', Math.min(0.5, 0.15 + sz * 0.08), 0.25);
  },
  mega() { noise(2.2, 0.8, 1800, 30); tone(70, 1.6, 'sine', 0.6, 0.3); tone(45, 2, 'triangle', 0.4, 0.5); },
  pickup() { tone(660, 0.08, 'square', 0.06); tone(990, 0.1, 'square', 0.06, 1, 0.07); tone(1320, 0.18, 'square', 0.06, 1, 0.14); },
  hurt() { tone(220, 0.35, 'sawtooth', 0.18, 0.3); noise(0.4, 0.3, 1500, 100); },
  roll() { noise(0.35, 0.12, 400, 4000, 0, 'bandpass'); },
  bomb() { noise(1.4, 0.7, 300, 40); tone(90, 1.2, 'sawtooth', 0.25, 0.25); tone(900, 0.8, 'sine', 0.1, 0.2); },
  warn() { for (let i = 0; i < 3; i++) { tone(880, 0.35, 'sawtooth', 0.07, 0.7, i * 0.8); tone(660, 0.35, 'sawtooth', 0.07, 0.7, i * 0.8 + 0.4); } },
  charge() { tone(180, 1.0, 'sawtooth', 0.05, 5); },
  laser() { noise(1.4, 0.18, 6000, 800, 0, 'bandpass'); tone(110, 1.4, 'sawtooth', 0.06, 0.9); },
  graze() { if (throttle('gr', 60)) tone(3200, 0.03, 'sine', 0.025); },
  kami() { if (throttle('kami', 150)) tone(500, 0.4, 'sawtooth', 0.05, 3); },
  shield() { tone(400, 0.4, 'sine', 0.15, 3); noise(0.3, 0.2, 5000, 1000); },
  clear() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.35, 'square', 0.07, 1, i * 0.12)); },
  start() { [392, 523, 784].forEach((f, i) => tone(f, 0.2, 'square', 0.06, 1, i * 0.08)); noise(0.6, 0.15, 500, 6000, 0, 'bandpass'); },
};
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
function scheduleMusic() {
  if (!AC) return;
  const spb = 60 / (intense ? 168 : 148) / 4;
  while (nextNoteT < AC.currentTime + 0.15) { playStep(stepI, nextNoteT); nextNoteT += spb; stepI = (stepI + 1) % 64; }
}
function bassNote(f, t, dur, vol) {
  const o = AC.createOscillator(), fl = AC.createBiquadFilter(), g = AC.createGain();
  o.type = 'sawtooth'; o.frequency.value = f;
  fl.type = 'lowpass'; fl.frequency.setValueAtTime(1400, t); fl.frequency.exponentialRampToValueAtTime(200, t + dur); fl.Q.value = 6;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(fl); fl.connect(g); g.connect(musicGain); o.start(t); o.stop(t + dur + 0.02);
}
function playStep(s, t) {
  if (muted || state === 'over') return;
  const bar = (s >> 4) & 3, i = s & 15;
  const roots = [45, 41, 43, 40];
  const r = roots[bar];
  if (i % 2 === 0) bassNote(mtof(i % 8 === 6 ? r + 12 : r), t, 0.16, 0.22);
  if (i % 4 === 0) { // kick
    const o = AC.createOscillator(), g = AC.createGain(); o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.18);
    g.gain.setValueAtTime(0.7, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.2); o.connect(g); g.connect(musicGain); o.start(t); o.stop(t + 0.22);
  }
  if (i === 4 || i === 12) noise(0.15, 0.25, 4000, 1200, t - AC.currentTime, 'bandpass', musicGain);
  if (i % 2 === 1) noise(0.04, 0.08, 9000, 7000, t - AC.currentTime, 'highpass', musicGain);
  if (intense || state === 'title') {
    const arp = [0, 7, 12, 15, 19, 15, 12, 7];
    if (intense || i % 4 === 0) tone(mtof(r + 24 + arp[i % 8]), 0.12, 'square', intense ? 0.035 : 0.025, 1, t - AC.currentTime, musicGain);
  }
}

/* ---------------- 입력 ---------------- */
const keys = {};
let mouseMode = false, isTouch = false, touchId = null, tlx = 0, tly = 0, touchAccX = 0;
const ptr = { wx: 0, wy: 0 };
addEventListener('keydown', e => {
  initAudio();
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab'].includes(e.code)) e.preventDefault();
  if (e.repeat) { keys[e.code] = true; return; }
  keys[e.code] = true;
  onPress(e.code);
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; if (state === 'play') paused = true; });
function onPress(code) {
  if (code === 'KeyM') { muted = !muted; if (master) master.gain.value = muted ? 0 : 0.55; return; }
  if (state === 'title') { if (code === 'Enter' || code === 'Space') startGame(); return; }
  if (state === 'over') { if ((code === 'Enter' || code === 'Space') && overT > 1.2) startGame(); return; }
  if (code === 'KeyP' || code === 'Escape') { paused = !paused; return; }
  if (paused) { paused = false; return; }
  if (code === 'Space' || code === 'KeyX' || code === 'KeyB') doBomb();
  if (code === 'ShiftLeft' || code === 'ShiftRight' || code === 'KeyZ' || code === 'KeyK') doRoll();
}
const rollBtn = () => ({ x: 70, y: VH - 150 }), bombBtn = () => ({ x: VW - 70, y: VH - 150 });
cvs.addEventListener('pointerdown', e => {
  initAudio();
  const wx = e.clientX / K, wy = e.clientY / K;
  if (e.pointerType === 'touch') isTouch = true;
  if (state === 'title') { startGame(); return; }
  if (state === 'over') { if (overT > 1.2) startGame(); return; }
  if (paused) { paused = false; return; }
  if (e.pointerType === 'touch') {
    const rb = rollBtn(), bb = bombBtn();
    if (dist(wx, wy, rb.x, rb.y) < 58) { doRoll(); return; }
    if (dist(wx, wy, bb.x, bb.y) < 58) { doBomb(); return; }
    touchId = e.pointerId; tlx = e.clientX; tly = e.clientY;
  } else {
    if (e.button === 2) doBomb();
    mouseMode = true; ptr.wx = wx; ptr.wy = wy;
  }
});
cvs.addEventListener('pointermove', e => {
  if (e.pointerType === 'touch') {
    if (e.pointerId !== touchId || !player || state !== 'play' || paused) return;
    const dx = (e.clientX - tlx) / K * 1.35, dy = (e.clientY - tly) / K * 1.35;
    tlx = e.clientX; tly = e.clientY;
    if (player.entry < 1.2) return;
    player.x = clamp(player.x + dx, 20, VW - 20); player.y = clamp(player.y + dy, 40, VH - 40);
    touchAccX += dx;
  } else { ptr.wx = e.clientX / K; ptr.wy = e.clientY / K; mouseMode = true; }
});
const endTouch = e => { if (e.pointerId === touchId) touchId = null; };
cvs.addEventListener('pointerup', endTouch);
cvs.addEventListener('pointercancel', endTouch);
cvs.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') paused = true; });

/* ---------------- 게임 상태 ---------------- */
let state = 'title', paused = false, stage = 1;
let score = 0, dispScore = 0, hiScore = 0, combo = 0, comboT = 0, comboPop = 0, maxCombo = 0, kills = 0, grazes = 0;
let player = null, pBullets = [], eBullets = [], enemies = [], pickups = [], parts = [], texts = [], beams = [], banners = [];
let groups = {}, groupId = 0;
let shake = 0, shakeRot = 0, flashA = 0, flashCol = '#ffffff', hurtA = 0, freeze = 0, timeScale = 1, slowT = 0, slowV = 1, zoom = 1, zoomKick = 0, warp = 0;
let stagePhase = 'intro', phaseT = 0, stageTime = 0, spawnT = 1, bombWave = null, gtime = 0, overT = 0, titleT = 0, stageHits = 0, newRecord = false;
const STAGE_LEN = 38;
try { hiScore = +localStorage.getItem('stormwing_hi') || 0; } catch (e) {}

function newPlayer() {
  return { x: VW / 2, y: VH + 80, vx: 0, vy: 0, r: 5, hp: 5, maxHp: 5, power: 1, bombs: 3, inv: 0, roll: 0, rollDir: 1, rollCd: 0, ghostT: 0,
    shield: 0, bank: 0, fireT: 0, misT: 0, muzzle: 0, entry: 0, dead: false, deadT: 0, trailT: 0 };
}
function startGame() {
  SFX.start();
  state = 'play'; paused = false; stage = 1;
  score = 0; dispScore = 0; combo = 0; comboT = 0; maxCombo = 0; kills = 0; grazes = 0; newRecord = false;
  player = newPlayer();
  pBullets = []; eBullets = []; enemies = []; pickups = []; parts = []; texts = []; beams = []; banners = []; groups = {};
  shake = 0; flashA = 0.6; flashCol = '#ffffff'; hurtA = 0; freeze = 0; timeScale = 1; slowT = 0; zoom = 1; zoomKick = 0; warp = 1.5;
  intense = false; bombWave = null;
  buildTerrain(); terrOld = null;
  beginStage();
}
function beginStage() {
  stagePhase = 'intro'; phaseT = 0; stageTime = 0; spawnT = 1; stageHits = 0;
  banners.push({ type: 'stage', t: 0, dur: 3.2 });
}
function nextStage() {
  stage++;
  terrOld = terr; terrFade = 1; buildTerrain();
  warp = 2.2; flashA = 0.5; flashCol = '#ffffff';
  player.hp = Math.min(player.maxHp, player.hp + 1);
  addText(player.x, player.y - 50, 'REPAIR +1', '#7dffb0', 18);
  beginStage();
}
const diffMul = () => 1 + (stage - 1) * 0.42 + Math.min(stageTime, 60) / 60 * 0.3;
const comboMult = () => 1 + Math.min(4, Math.floor(combo / 10)) * 0.5;

/* ---------------- 파티클 ---------------- */
function addP(o) {
  if (parts.length > 2400) return null;
  o.max = o.life; o.vx = o.vx || 0; o.vy = o.vy || 0; o.drag = o.drag || 0; if (o.a == null) o.a = 1; o.rot = o.rot || 0; o.vr = o.vr || 0;
  parts.push(o); return o;
}
function addText(x, y, str, col = '#fff', size = 16, dur = 0.9) { texts.push({ x, y, str, col, size, t: 0, dur }); }
function sparks(x, y, n, col, spd = 400, ang = null, spread = TAU, life = 0.35) {
  for (let i = 0; i < n; i++) {
    const a = ang == null ? Math.random() * TAU : ang + rand(-spread / 2, spread / 2), s = rand(spd * 0.4, spd);
    addP({ kind: 'spark', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(life * 0.5, life), size: rand(1.5, 3), color: col, drag: 4 });
  }
}
function explode(x, y, sz = 1, col = '#ff9a2e') {
  addP({ kind: 'glow', x, y, size: 70 * sz, life: 0.22, color: '#fff3d0' });
  addP({ kind: 'ring', x, y, size: 8 * sz, grow: 80 * sz, life: 0.45, color: col, w: 5 * Math.sqrt(sz) });
  if (sz > 1.5) addP({ kind: 'ring', x, y, size: 4 * sz, grow: 140 * sz, life: 0.7, color: '#ffffff', w: 2.5, a: 0.6 });
  sparks(x, y, Math.round(10 * sz), '#ffd27a', 520 * Math.sqrt(sz), null, TAU, 0.5);
  for (let i = 0; i < 6 * sz; i++) {
    const a = Math.random() * TAU, s = rand(20, 140) * Math.sqrt(sz);
    addP({ kind: 'glow', x: x + rand(-8, 8) * sz, y: y + rand(-8, 8) * sz, vx: Math.cos(a) * s, vy: Math.sin(a) * s, size: rand(14, 30) * Math.sqrt(sz), life: rand(0.35, 0.7), color: Math.random() < .5 ? col : '#ff5a1e', drag: 2.5 });
  }
  for (let i = 0; i < 4 * sz; i++) {
    const a = Math.random() * TAU, s = rand(20, 90) * Math.sqrt(sz);
    addP({ kind: 'smoke', dark: true, x: x + rand(-10, 10) * sz, y: y + rand(-10, 10) * sz, vx: Math.cos(a) * s, vy: Math.sin(a) * s + 70, size: rand(8, 16) * Math.sqrt(sz), grow: 36 * Math.sqrt(sz), life: rand(0.8, 1.5), a: 0.55, drag: 1.5 });
  }
  for (let i = 0; i < Math.min(10, 3 * sz); i++) {
    const a = Math.random() * TAU, s = rand(120, 360) * Math.sqrt(sz);
    addP({ kind: 'debris', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.6, 1.2), size: rand(4, 9), color: '#2b2f38', vr: rand(-14, 14), drag: 1.6, em: 0 });
  }
  shake = Math.max(shake, 3 + 3.5 * sz);
  SFX.boom(sz);
}

/* ---------------- 적 / 탄 생성 ---------------- */
const EDEF = {
  drone: { hp: 3, r: 17, score: 100 },
  kami: { hp: 4, r: 15, score: 150 },
  gun: { hp: 46, r: 40, score: 1200 },
};
function spawnEnemy(type, o) {
  const d = EDEF[type];
  const e = Object.assign({ type, r: d.r, score: d.score, t: 0, flash: 0, ang: Math.PI / 2, fireT: rand(0.8, 2.2), st: 0, turA: Math.PI / 2 }, o);
  e.hp = e.maxHp = Math.ceil(d.hp * diffMul());
  if (e.group != null) groups[e.group].total++;
  enemies.push(e); return e;
}
function newGroup() { const id = ++groupId; groups[id] = { total: 0, killed: 0 }; return id; }
function spawnPattern() {
  const opts = [['v', 3], ['sweep', 3], ['kami', 2.2], ['gun', stageTime > 6 && enemies.filter(e => e.type === 'gun').length < 2 ? 1.5 : 0], ['wall', stage >= 2 ? 1.6 : 0.6], ['cross', stage >= 2 ? 1.6 : 0.5]];
  let tot = opts.reduce((s, o) => s + o[1], 0), r = Math.random() * tot, pick = 'v';
  for (const o of opts) { r -= o[1]; if (r <= 0) { pick = o[0]; break; } }
  const g = newGroup();
  if (pick === 'v') {
    const n = 5, cx = rand(VW * 0.2, VW * 0.8), amp = rand(20, 70), fr = rand(1, 2);
    for (let i = 0; i < n; i++) { const off = i - (n - 1) / 2; spawnEnemy('drone', { x: cx + off * 46, y: -40 - Math.abs(off) * 42, ai: 'dive', x0: cx + off * 46, amp, freq: fr, ph: 0, vy: 150 + stage * 10, group: g }); }
  } else if (pick === 'sweep' || pick === 'cross') {
    const sides = pick === 'cross' ? [1, -1] : [Math.random() < .5 ? 1 : -1];
    for (const dir of sides) {
      const y0 = rand(40, VH * 0.22) + (dir < 0 && sides.length > 1 ? 60 : 0), n = 6;
      for (let i = 0; i < n; i++) spawnEnemy('drone', { x: dir > 0 ? -40 - i * 52 : VW + 40 + i * 52, y: y0, ai: 'sweep', dir, y0, sp: 260 + stage * 12, arc: rand(140, 260), group: g });
    }
  } else if (pick === 'kami') {
    const n = 2 + Math.min(3, stage);
    for (let i = 0; i < n; i++) spawnEnemy('kami', { x: rand(60, VW - 60), y: -40 - i * 30, ai: 'kami', ty: rand(70, VH * 0.3), delay: i * 0.35, group: g });
  } else if (pick === 'gun') {
    const x = rand(VW * 0.25, VW * 0.75);
    spawnEnemy('gun', { x, y: -80, ai: 'gun', x0: x, ty: rand(110, VH * 0.28), stay: 7 + stage, burst: 0 });
    for (const s of [-1, 1]) spawnEnemy('drone', { x: x + s * 80, y: -60, ai: 'dive', x0: x + s * 80, amp: 30, freq: 1.5, ph: s, vy: 140, group: g });
  } else if (pick === 'wall') {
    const n = 7, gap = VW / (n + 1);
    for (let i = 0; i < n; i++) spawnEnemy('drone', { x: gap * (i + 1), y: -40 - (i % 2) * 50, ai: 'dive', x0: gap * (i + 1), amp: 12, freq: 3, ph: i, vy: 120 + stage * 8, group: g });
  }
}
function shoot(x, y, ang, spd, o) {
  if (eBullets.length > 700) return;
  const s = spd * (0.92 + stage * 0.08);
  eBullets.push(Object.assign({ x, y, vx: Math.cos(ang) * s, vy: Math.sin(ang) * s, r: 6, col: '#ff3d8b', kind: 'orb', t: 0, acc: 0 }, o || {}));
}
const aimAt = (x, y) => Math.atan2(player.y - y, player.x - x);
function ring(x, y, n, spd, off, o) { for (let i = 0; i < n; i++) shoot(x, y, off + i / n * TAU, spd, o); }
function fan(x, y, ang, n, spread, spd, o) { for (let i = 0; i < n; i++) { const t = n === 1 ? 0 : i / (n - 1) - 0.5; shoot(x, y, ang + t * spread, spd, o); } }
function muzzle(x, y, col, s = 16) { addP({ kind: 'glow', x, y, size: s, life: 0.12, color: col }); }

function dropPickup(x, y, good) {
  let type;
  const r = Math.random();
  if (player.hp < player.maxHp && r < 0.22) type = 'H';
  else if (r < 0.62 || (good && player.power < 5 && r < 0.75)) type = 'P';
  else if (r < 0.82) type = 'S';
  else type = 'B';
  pickups.push({ x, y, type, t: 0, vy: -160, vx: rand(-60, 60) });
}

/* ---------------- 플레이어 액션 ---------------- */
function doRoll() {
  const p = player; if (!p || p.dead || p.roll > 0 || p.rollCd > 0 || p.entry < 1.2) return;
  let dir = 0; if (keys.ArrowLeft || keys.KeyA) dir = -1; if (keys.ArrowRight || keys.KeyD) dir = 1;
  if (!dir) dir = Math.abs(p.vx) > 30 ? Math.sign(p.vx) : (Math.random() < .5 ? -1 : 1);
  p.roll = 0.0001; p.rollDir = dir; p.rollCd = 1.0;
  SFX.roll();
  addP({ kind: 'ring', x: p.x, y: p.y, size: 20, grow: 50, life: 0.35, color: '#7fd8ff', w: 3 });
}
function doBomb() {
  const p = player; if (!p || p.dead || p.bombs <= 0 || bombWave || p.entry < 1.2) return;
  p.bombs--; p.inv = Math.max(p.inv, 2.2);
  bombWave = { x: p.x, y: p.y, t: 0, dur: 0.9, hit: new Set() };
  flashA = 0.9; flashCol = '#c8f4ff'; shake = Math.max(shake, 22); slowT = 0.5; slowV = 0.35; zoomKick = 0.06;
  SFX.bomb();
  for (let i = 0; i < 3; i++) addP({ kind: 'ring', x: p.x, y: p.y, size: 10, grow: 400 + i * 260, life: 0.8 + i * 0.2, color: i ? '#7fd8ff' : '#ffffff', w: 14 - i * 4 });
  sparks(p.x, p.y, 60, '#bdf2ff', 1100, null, TAU, 0.8);
  addText(p.x, p.y - 60, 'BOMB!', '#bdf2ff', 34, 1.1);
}
function clearBullets() {
  for (const b of eBullets) {
    addP({ kind: 'glow', x: b.x, y: b.y, size: 10, life: 0.4, color: '#ffd23f', vx: (player.x - b.x) * 1.4, vy: (player.y - b.y) * 1.4, drag: 1 });
    score += 10;
  }
  eBullets.length = 0;
  beams.length = 0;
}
function hitPlayer() {
  const p = player;
  if (p.dead || p.inv > 0 || p.roll > 0 || p.entry < 1.2) return;
  if (p.shield > 0) {
    p.shield = 0; p.inv = 1.2; SFX.shield();
    for (let i = 0; i < 3; i++) addP({ kind: 'ring', x: p.x, y: p.y, size: 30, grow: 90 + i * 50, life: 0.5 + i * 0.1, color: '#5ce1ff', w: 6 });
    sparks(p.x, p.y, 30, '#9ff0ff', 600);
    addText(p.x, p.y - 50, 'SHIELD BREAK', '#5ce1ff', 18);
    shake = Math.max(shake, 10);
    return;
  }
  p.hp--; p.inv = 2.2; stageHits++;
  hurtA = 0.85; shake = Math.max(shake, 18); freeze = 0.09; combo = 0; comboT = 0; zoomKick = 0.04;
  SFX.hurt();
  sparks(p.x, p.y, 30, '#ff8a6a', 700);
  explode(p.x, p.y, 0.8, '#ff6a3d');
  if (p.hp <= 0) killPlayer();
}
function killPlayer() {
  const p = player; p.dead = true; p.deadT = 0;
  explode(p.x, p.y, 3.2, '#ff7a2e');
  setTimeout(() => { if (state === 'play') explode(p.x + 20, p.y - 10, 2); }, 180);
  slowT = 1.6; slowV = 0.25; flashA = 0.8; flashCol = '#ffffff'; shake = 30; zoomKick = 0.1;
  SFX.mega();
}

/* ---------------- 보스 ---------------- */
const BOSS_CIRCLES = [{ x: 0, y: 10, r: 66 }, { x: -120, y: -8, r: 46 }, { x: 120, y: -8, r: 46 }, { x: -185, y: -10, r: 24 }, { x: 185, y: -10, r: 24 }];
let boss = null;
function spawnBoss() {
  const hp = Math.round(1400 * (1 + 0.45 * (stage - 1)));
  boss = { type: 'boss', x: VW / 2, y: -240, hp, maxHp: hp, trailHp: hp, t: 0, enter: 0, phase: 0, pat: 0, patT: 0, fireT: 1, sa: 0, spin: 0, flash: 0,
    dying: 0, deathT: 0, expT: 0, rage: 0, turA: [Math.PI / 2, Math.PI / 2], r: 80, score: 30000 * stage, nameT: 0, smokeT: 0, t0: 0 };
  enemies.push(boss);
  intense = true;
  slowT = 1.2; slowV = 0.6;
}
const PATS = [['fan', 'spiral'], ['flower', 'summon'], ['laser', 'chaos']];
const PATLEN = { fan: 4.5, spiral: 4.2, flower: 4.4, summon: 4.2, laser: 3.8, chaos: 4.6 };
function turretPos(b, i) { return { x: b.x + (i ? 98 : -98), y: b.y + 2 }; }
function updBoss(b, dt, rdt) {
  b.t += dt; b.flash -= dt; b.spin += dt;
  if (b.trailHp > b.hp) b.trailHp = Math.max(b.hp, b.trailHp - Math.max(30, (b.trailHp - b.hp) * 2.5) * rdt);
  if (b.dying > 0) {
    b.deathT += rdt; b.y += 14 * dt; b.x += Math.sin(b.deathT * 30) * 1.5;
    shake = Math.max(shake, 5 + b.deathT * 4);
    b.expT -= rdt;
    if (b.expT <= 0) {
      b.expT = 0.09;
      const c = BOSS_CIRCLES[(Math.random() * BOSS_CIRCLES.length) | 0];
      explode(b.x + c.x + rand(-c.r, c.r), b.y + c.y + rand(-c.r, c.r) * 0.7, rand(0.9, 1.9), Math.random() < .5 ? '#ff9a2e' : '#ff4a6e');
      b.flash = 0.04;
    }
    if (b.deathT > 2.6) bossFinal(b);
    return;
  }
  if (b.enter < 1) {
    b.enter = Math.min(1, b.enter + dt / 3.2);
    b.y = lerp(-240, 175, ease.outCubic(b.enter)); b.x = VW / 2;
    if (b.enter >= 1) b.t0 = b.t;
    return;
  }
  const tt = b.t - b.t0;
  b.x = VW / 2 + Math.sin(tt * 0.42) * Math.min(VW * 0.26, 260);
  b.y = 175 + Math.sin(tt * 0.9) * 18;
  for (let i = 0; i < 2; i++) { const tp = turretPos(b, i); b.turA[i] = turnTo(b.turA[i], aimAt(tp.x, tp.y), dt * 3.5); }
  // 손상 연기
  b.smokeT -= dt;
  if (b.phase >= 1 && b.smokeT <= 0) {
    b.smokeT = b.phase === 2 ? 0.05 : 0.12;
    const c = BOSS_CIRCLES[(Math.random() * 3) | 0];
    const sx = b.x + c.x + rand(-c.r, c.r) * 0.6, sy = b.y + c.y + rand(-20, 20);
    addP({ kind: 'smoke', dark: true, x: sx, y: sy, vy: 160, vx: rand(-20, 20), size: rand(8, 14), grow: 30, life: 1, a: 0.5 });
    if (Math.random() < .5) addP({ kind: 'glow', x: sx, y: sy, vy: 120, size: rand(8, 16), life: 0.3, color: '#ff7a2e' });
  }
  const ratio = b.hp / b.maxHp, ph = ratio > 0.66 ? 0 : ratio > 0.33 ? 1 : 2;
  if (ph > b.phase) {
    b.phase = ph; b.rage = 1.8; b.pat = 0; b.patT = 0; b.fireT = 0;
    clearBullets();
    flashA = 0.6; flashCol = '#ff4a6e'; shake = Math.max(shake, 20); slowT = 0.5; slowV = 0.4; zoomKick = 0.05;
    for (let i = 0; i < 3; i++) addP({ kind: 'ring', x: b.x, y: b.y + 10, size: 30, grow: 250 + i * 150, life: 0.7 + i * 0.15, color: i ? '#ff4a6e' : '#ffffff', w: 10 - i * 3 });
    sparks(b.x, b.y, 50, '#ffb0c0', 900);
    banners.push({ type: 'phase', t: 0, dur: 1.8, n: ph + 1 });
    SFX.boom(3);
  }
  if (b.rage > 0) { b.rage -= dt; return; }
  const name = PATS[b.phase][b.pat % 2];
  b.patT += dt; b.fireT -= dt;
  const core = { x: b.x, y: b.y + 12 };
  const fire = b.fireT <= 0;
  switch (name) {
    case 'fan':
      if (fire) { b.fireT = 0.6; for (let i = 0; i < 2; i++) { const tp = turretPos(b, i), a = b.turA[i]; fan(tp.x + Math.cos(a) * 30, tp.y + Math.sin(a) * 30, a, 5, 0.7, 250, { kind: 'needle', col: '#ffb020', r: 5 }); muzzle(tp.x + Math.cos(a) * 30, tp.y + Math.sin(a) * 30, '#ffb020', 26); } }
      break;
    case 'spiral':
      if (fire) { b.fireT = 0.075; b.sa += 0.29; for (let k = 0; k < 2; k++) shoot(core.x, core.y, b.sa + k * Math.PI, 185, { col: '#ff3d8b' }); }
      break;
    case 'flower':
      if (fire) { b.fireT = 0.42; b.sa += 0.13; ring(core.x, core.y, 22, 120, b.sa, { col: '#c04bff', acc: 90, r: 7 }); muzzle(core.x, core.y, '#c04bff', 50); }
      break;
    case 'summon':
      if (b.patT < dt * 1.5) for (const s of [-1, 1]) for (let k = 0; k < 2; k++) spawnEnemy('drone', { x: b.x + s * (150 + k * 30), y: b.y - 10, ai: 'dive', x0: b.x + s * (150 + k * 30), amp: 40, freq: 1.6, ph: k, vy: 170 });
      if (fire) { b.fireT = 0.7; fan(core.x, core.y, aimAt(core.x, core.y), 3, 0.35, 280, { kind: 'big', col: '#ff3d3d', r: 10 }); muzzle(core.x, core.y, '#ff3d3d', 40); }
      break;
    case 'laser':
      if (b.patT < dt * 1.5) { for (let i = 0; i < 2; i++) beams.push({ src: i, ang: b.turA[i], t: 0, charge: 1.1, dur: 1.7, w: 0 }); SFX.charge(); }
      if (fire) { b.fireT = 0.9; ring(core.x, core.y, 16, 150, Math.random(), { col: '#ff7a2e' }); }
      break;
    case 'chaos':
      if (fire) {
        b.fireT = 0.1; b.sa += 0.23;
        for (let k = 0; k < 3; k++) shoot(core.x, core.y, b.sa + k * TAU / 3, 200, { col: '#c04bff' });
        if (((b.patT * 10) | 0) % 7 === 0) shoot(core.x, core.y, aimAt(core.x, core.y), 300, { kind: 'big', col: '#ff3d3d', r: 10 });
      }
      break;
  }
  if (b.patT > PATLEN[name]) { b.patT = 0; b.pat++; b.fireT = 0.7; }
}
function startBossDeath(b) {
  b.dying = 1; b.deathT = 0; b.hp = 0;
  clearBullets();
  slowT = 2.6; slowV = 0.4; zoomKick = 0.05;
  banners = banners.filter(x => x.type !== 'phase');
}
function bossFinal(b) {
  b.dead = true; boss = null; intense = false;
  for (let i = 0; i < 5; i++) explode(b.x + rand(-120, 120), b.y + rand(-40, 40), 3, i % 2 ? '#ff4a6e' : '#ffb340');
  for (let i = 0; i < 4; i++) addP({ kind: 'ring', x: b.x, y: b.y, size: 20, grow: 500 + i * 300, life: 1 + i * 0.2, color: ['#ffffff', '#ffd27a', '#ff7a2e', '#ff4a6e'][i], w: 18 - i * 3 });
  for (let i = 0; i < 30; i++) { const a = Math.random() * TAU, s = rand(200, 700); addP({ kind: 'debris', x: b.x, y: b.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(1, 2), size: rand(6, 16), color: '#353a48', vr: rand(-10, 10), drag: 1.2, em: 0 }); }
  flashA = 1; flashCol = '#ffffff'; shake = 40; freeze = 0.15; slowT = 1; slowV = 0.3; zoomKick = 0.12;
  SFX.mega();
  const pts = b.score; score += pts;
  addText(b.x, b.y, '+' + pts, '#ffd23f', 40, 2);
  for (let i = 0; i < 3; i++) pickups.push({ x: b.x + (i - 1) * 50, y: b.y, type: i === 1 ? 'P' : (i ? 'B' : 'H'), t: 0, vy: -200, vx: (i - 1) * 90 });
  kills++;
  stagePhase = 'clear'; phaseT = 0;
  banners.push({ type: 'clear', t: 0, dur: 4.6, bonus: pts, nohit: stageHits === 0 });
  if (stageHits === 0) score += 20000 * stage;
  setTimeout(() => SFX.clear(), 600);
}

/* ---------------- 업데이트 ---------------- */
function update(dt, rdt) {
  gtime += rdt;
  // 배경 스크롤
  const spdMul = 1 + warp * 2.5 + (player && player.roll > 0 ? 0.6 : 0);
  terrScroll += 55 * dt * (1 + warp * 4);
  if (terrFade > 0) terrFade = Math.max(0, terrFade - rdt / 2.2);
  warp = Math.max(0, warp - rdt * 0.9);
  for (const c of clouds) {
    c.y += c.sp * dt * spdMul;
    if (c.y > VH + 50) Object.assign(c, newCloud(c.layer));
  }
  for (const l of lines) { l.y += l.sp * dt * spdMul; if (l.y - l.len > VH) { l.y = -rand(0, 300); l.x = rand(0, VW); } }

  if (state === 'title') { titleT += rdt; updParts(dt); return; }
  if (state === 'over') { overT += rdt; updParts(dt); updTexts(rdt); return; }

  const p = player;
  updStage(dt);
  updPlayer(dt);

  // 플레이어 탄
  for (const b of pBullets) {
    if (b.type === 'm') {

/* ---------------- 배너 / 연출 텍스트 ---------------- */
function spaced(str, x, y, sp) {

  w -= sp;

  ctx.textAlign = 'left';
  for (const ch of str) { ctx.fillText(ch, cx, y); cx += ws[i++] + sp; }
}

  banners = banners.filter(b => b.t < b.dur);
}

/* ---------------- 타이틀 / 게임오버 / 일시정지 ---------------- */
function titleJetPos() { return { x: VW / 2 + Math.sin(titleT * 0.9) * 60, y: VH * 0.66 + Math.sin(titleT * 1.7) * 14, bank: Math.cos(titleT * 0.9) * 0.6 }; }
function drawTitleJet() {
  const j = titleJetPos();
  DM = 2; ctx.globalAlpha = 0.22; drawJet(j.x + 60, j.y + 100, j.bank, 0, 0.9); DM = 0; ctx.globalAlpha = 1;
  drawJet(j.x, j.y, j.bank, 0, 1.6);
  if (Math.random() < 0.9) for (const s of [-1, 1]) addP({ kind: 'smoke', x: j.x + s * 54 * (1 - Math.abs(j.bank) * 0.3), y: j.y + 26, vy: 380, size: 2, grow: 7, life: 0.5, a: 0.4 });
}
function drawTitle() {
  const t = titleT;
  ctx.textBaseline = 'middle';
  // 상단 그라데이션
  const g = ctx.createLinearGradient(0, 0, 0, VH * 0.55); g.addColorStop(0, 'rgba(0,6,20,0.75)'); g.addColorStop(1, 'rgba(0,6,20,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH * 0.55);
  const title = 'STORM WING', cy = VH * 0.24;
  let fs = 76;
  ctx.font = `900 ${fs}px ${FD}`;
  const mw = ctx.measureText(title).width + 18;
  if (mw > VW * 0.9) { fs = Math.floor(fs * VW * 0.9 / mw); ctx.font = `900 ${fs}px ${FD}`; }
  let w = 0; const ws = []; for (const ch of title) { const m = ctx.measureText(ch).width; ws.push(m); w += m + 2; }
  let x = VW / 2 - w / 2;
  ctx.globalCompositeOperation = 'lighter';
  glow(VW / 2, cy, w * 0.7, '#2f6cff', 0.25 + Math.sin(t * 2) * 0.05);
  ctx.globalCompositeOperation = 'source-over';
  [...title].forEach((ch, i) => {
    const lt = clamp((t - i * 0.07) / 0.7, 0, 1);
    if (lt <= 0) { x += ws[i] + 2; return; }
    const yy = cy - (1 - ease.outBack(lt)) * 180 + Math.sin(t * 2.4 + i * 0.5) * 3;
    ctx.globalAlpha = Math.min(1, lt * 2);
    const gr = ctx.createLinearGradient(0, yy - fs / 2, 0, yy + fs / 2);
    gr.addColorStop(0, '#ffffff'); gr.addColorStop(0.45, '#9fdcff'); gr.addColorStop(0.55, '#2b6cff'); gr.addColorStop(1, '#8fe0ff');
    ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(0,10,40,0.8)'; ctx.textAlign = 'left';
    ctx.strokeText(ch, x, yy);
    ctx.fillStyle = gr; ctx.fillText(ch, x, yy);
    x += ws[i] + 2;
  });
  // 빛 스윕
  const sweep = ((t % 3.2) / 3.2) * (w + 400) - 200;
  ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.25;
  ctx.drawImage(glowSpr('#9fdcff'), VW / 2 - w / 2 + sweep - 60, cy - fs, 120, fs * 2);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = clamp((t - 1.0) / 0.6, 0, 1);
  ctx.textAlign = 'center'; ctx.font = `${Math.min(26, VW / 18)}px ${FK}`; ctx.fillStyle = '#cfeaff';
  ctx.fillText('스톰 윙 · 하늘의 결전', VW / 2, cy + fs * 0.85);
  // 컨트롤 안내
  const ca = clamp((t - 1.5) / 0.6, 0, 1);
  ctx.globalAlpha = ca;
  const rows = isTouch ? [['드래그', '이동 (자동 사격)'], ['ROLL 버튼', '배럴 롤 (무적 회피)'], ['BOMB 버튼', '폭탄 (탄 제거)']]
    : [['WASD / 방향키 / 마우스', '이동 (자동 사격)'], ['SHIFT / Z', '배럴 롤 (무적 회피)'], ['SPACE / X / 우클릭', '폭탄 (탄 제거)'], ['P · M', '일시정지 · 음소거']];
  const py = VH * 0.36 + fs * 0.5;
  ctx.fillStyle = 'rgba(0,10,30,0.55)'; const bw = Math.min(420, VW - 40);
  ctx.fillRect(VW / 2 - bw / 2, py - 18, bw, rows.length * 26 + 18);
  rows.forEach((r, i) => {
    ctx.font = `700 12px ${FD}`; ctx.textAlign = 'right'; ctx.fillStyle = '#7fd8ff'; ctx.fillText(r[0], VW / 2 - 8, py + i * 26);
    ctx.font = `14px ${FK}`; ctx.textAlign = 'left'; ctx.fillStyle = '#ffffff'; ctx.fillText(r[1], VW / 2 + 8, py + i * 26);
  });
  ctx.globalAlpha = (0.55 + Math.sin(t * 5) * 0.45) * clamp((t - 1.8) / 0.4, 0, 1);
  ctx.font = `900 18px ${FD}`; ctx.textAlign = 'center'; ctx.fillStyle = '#ffffff';
  ctx.fillText(isTouch ? 'TAP TO START' : 'PRESS ENTER / CLICK', VW / 2, VH * 0.88);
  if (hiScore > 0) { ctx.globalAlpha = 0.7; ctx.font = `700 12px ${FD}`; ctx.fillStyle = '#ffd23f'; ctx.fillText('HI-SCORE ' + hiScore, VW / 2, VH * 0.92 + 8); }
  ctx.globalAlpha = 1;
}
function drawGameOver() {
  const t = overT;
  ctx.globalAlpha = Math.min(0.7, t * 0.7); ctx.fillStyle = '#05000a'; ctx.fillRect(0, 0, VW, VH);
  ctx.globalAlpha = 1;
  const cy = VH * 0.3;
  const fs = Math.min(56, VW / 9);
  ctx.font = `900 ${fs}px ${FD}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const a = clamp(t / 0.4, 0, 1);
  const glitch = Math.random() < 0.12 || t < 0.6;
  const gx = glitch ? rand(-8, 8) : 0;
  ctx.globalAlpha = a;
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = '#ff0040'; ctx.fillText('MISSION FAILED', VW / 2 - 3 + gx, cy);
  ctx.fillStyle = '#00e0ff'; ctx.fillText('MISSION FAILED', VW / 2 + 3 - gx, cy);
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#ffffff'; ctx.fillText('MISSION FAILED', VW / 2, cy);
  if (glitch) { for (let i = 0; i < 3; i++) { const yy = cy + rand(-fs / 2, fs / 2); ctx.drawImage(cvs, 0, (yy * K) * DPR, cvs.width, 6 * DPR, rand(-20, 20), yy, VW, 6); } }
  ctx.font = `20px ${FK}`; ctx.fillStyle = '#ffb0c0'; ctx.fillText('기체 격추 — 작전 실패', VW / 2, cy + fs * 0.8);
  const rows = [['SCORE', String(score)], ['STAGE', String(stage)], ['KILLS', String(kills)], ['MAX COMBO', String(maxCombo)], ['GRAZE', String(grazes)], ['HI-SCORE', String(hiScore)]];
  rows.forEach((r, i) => {
    const ra = clamp((t - 0.6 - i * 0.12) / 0.3, 0, 1); if (ra <= 0) return;
    ctx.globalAlpha = ra; const ox = (1 - ease.outCubic(ra)) * 80;
    ctx.font = `700 15px ${FD}`; ctx.textAlign = 'left'; ctx.fillStyle = '#9fd8ff'; ctx.fillText(r[0], VW / 2 - 150 - ox, cy + 80 + i * 30);
    ctx.textAlign = 'right'; ctx.fillStyle = '#fff'; ctx.fillText(r[1], VW / 2 + 150 + ox, cy + 80 + i * 30);
  });
  if (newRecord && t > 1.4) {
    const s = 1 + Math.sin(t * 8) * 0.06;
    ctx.save(); ctx.translate(VW / 2, cy + 80 + rows.length * 30 + 20); ctx.scale(s, s); ctx.rotate(-0.05);
    ctx.globalAlpha = 1; ctx.font = `900 22px ${FD}`; ctx.textAlign = 'center'; ctx.fillStyle = `hsl(${(t * 300) % 360},100%,65%)`; ctx.fillText('NEW RECORD!', 0, 0);
    ctx.restore();
  }
  if (t > 1.2) {
    ctx.globalAlpha = 0.55 + Math.sin(t * 5) * 0.45; ctx.font = `900 16px ${FD}`; ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
    ctx.fillText(isTouch ? 'TAP TO RETRY' : 'ENTER / CLICK TO RETRY', VW / 2, VH * 0.88);
  }
  ctx.globalAlpha = 1;
}
function drawPause() {
  ctx.globalAlpha = 0.55; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, VW, VH); ctx.globalAlpha = 1;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = `900 44px ${FD}`; ctx.fillStyle = '#fff'; ctx.fillText('PAUSED', VW / 2, VH * 0.45);
  ctx.font = `16px ${FK}`; ctx.fillStyle = '#9fd8ff'; ctx.fillText('아무 키나 눌러 계속', VW / 2, VH * 0.45 + 40);
}

/* ---------------- 메인 루프 ---------------- */
let last = performance.now();
function frame(now) {
  const rdt = Math.min(0.05, (now - last) / 1000); last = now;
  if (slowT > 0) { slowT -= rdt; timeScale = lerp(timeScale, slowV, Math.min(1, rdt * 12)); }
  else timeScale = lerp(timeScale, 1, Math.min(1, rdt * 5));
  if (!paused) {
    if (freeze > 0) freeze -= rdt;
    else update(rdt * timeScale, rdt);
  }
  render(paused ? 0 : rdt);
  requestAnimationFrame(frame);
}
addEventListener('resize', resize);
resize();
requestAnimationFrame(frame);
</script>
