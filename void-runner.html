<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Void Runner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
  canvas{display:block;width:100vw;height:100vh;cursor:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/* =====================================================================
   VOID RUNNER — 3인칭 의사 3D 레일 슈터 (단일 파일)
   ===================================================================== */
const cvs = document.getElementById('c'), ctx = cvs.getContext('2d');
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const ease = {
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inCubic: t => t * t * t,
  outBack: t => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
  outElastic: t => t <= 0 ? 0 : t >= 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (TAU / 3)) + 1,
};
const FD = '"Orbitron","Segoe UI",sans-serif';
const FK = '"Black Han Sans","Malgun Gothic","Apple SD Gothic Neo",sans-serif';

let SW, SH, DPR, K, VW, VH, F0, cx, cy;
function resize() {
  DPR = Math.min(2, devicePixelRatio || 1); SW = innerWidth; SH = innerHeight;
  cvs.width = Math.round(SW * DPR); cvs.height = Math.round(SH * DPR);
  K = clamp(Math.min(SW / 1100, SH / 700), 0.4, 1.6); VW = SW / K; VH = SH / K;
  F0 = Math.min(VW * 0.62, VH * 0.95); cx = VW / 2; cy = VH * 0.5;
  buildMountains();
}

/* ---------- 글로우 ---------- */
const GLOW = {};
function glowSpr(col) {
  let c = GLOW[col]; if (c) return c;
  c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.2, col); gr.addColorStop(0.5, col + '44'); gr.addColorStop(1, col + '00');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64); return GLOW[col] = c;
}
function glow(x, y, r, col, a = 1) { if (r <= 0) return; ctx.globalAlpha = a; ctx.drawImage(glowSpr(col), x - r, y - r, r * 2, r * 2); }
const SMOKE = (() => { const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32); gr.addColorStop(0, 'rgba(200,200,220,0.8)'); gr.addColorStop(1, 'rgba(200,200,220,0)'); g.fillStyle = gr; g.fillRect(0, 0, 64, 64); return c; })();

/* ---------- 섹터 테마 ---------- */
const THEMES = [
  { name: '신스웨이브 협곡', en: 'SYNTH CANYON', sky: ['#0b0326', '#3a0b5e', '#ff3d8b'], floor: '#12021f', grid: '#ff3dd2', sun: ['#ffe066', '#ff3d8b'], mtn: '#1d0638', acc: '#2affff', rock: '#4a2a6a' },
  { name: '독성 성운', en: 'TOXIC NEBULA', sky: ['#011a12', '#05402e', '#4dff9a'], floor: '#021a10', grid: '#3dff8a', sun: ['#eaff6a', '#2ad18a'], mtn: '#043024', acc: '#ffe14d', rock: '#2a5a3a' },
  { name: '빙결 궤도', en: 'CRYO ORBIT', sky: ['#020a26', '#0b2a6a', '#5ad8ff'], floor: '#020c22', grid: '#4dc8ff', sun: ['#ffffff', '#5ad8ff'], mtn: '#0a1d4a', acc: '#ff6af0', rock: '#3a4a7a' },
  { name: '용광 지대', en: 'INFERNO BELT', sky: ['#1a0202', '#5a0a06', '#ff7a2a'], floor: '#1a0402', grid: '#ff5a2a', sun: ['#fff0a0', '#ff3a1a'], mtn: '#300806', acc: '#5affd8', rock: '#6a3020' },
];
const theme = () => THEMES[(sector - 1) % THEMES.length];
let mtnA = [], mtnB = [];
function buildMountains() {
  mtnA = []; mtnB = [];
  for (let i = 0; i <= 60; i++) { mtnA.push(rand(0.02, 0.13) * (Math.sin(i * 0.7) * 0.5 + 1)); mtnB.push(rand(0.01, 0.07)); }
}

/* ---------- 오디오 ---------- */
let AC = null, master, sfxG, musG, NOISE, muted = false, nextNoteT = 0, stepI = 0, engOsc = null, engGain = null, engFil = null;
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.5; master.connect(AC.destination);
    sfxG = AC.createGain(); sfxG.gain.value = 0.8; sfxG.connect(master);
    musG = AC.createGain(); musG.gain.value = 0.28; musG.connect(master);
    NOISE = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
    const d = NOISE.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    engOsc = AC.createOscillator(); engOsc.type = 'sawtooth'; engOsc.frequency.value = 60;
    engFil = AC.createBiquadFilter(); engFil.type = 'lowpass'; engFil.frequency.value = 300;
    engGain = AC.createGain(); engGain.gain.value = 0;
    engOsc.connect(engFil); engFil.connect(engGain); engGain.connect(master); engOsc.start();
    nextNoteT = AC.currentTime + 0.1; setInterval(music, 25);
  } catch (e) { AC = null; }
}
function tone(f, dur, type = 'square', vol = 0.1, slide = 1, delay = 0, out) {
  if (!AC || muted) return; const t = AC.currentTime + Math.max(0, delay);
  const o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide !== 1) o.frequency.exponentialRampToValueAtTime(Math.max(20, f * slide), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(out || sfxG); o.start(t); o.stop(t + dur + 0.05);
}
function noise(dur, vol, f0, f1, delay = 0, type = 'lowpass', out) {
  if (!AC || muted) return; const t = AC.currentTime + Math.max(0, delay);
  const s = AC.createBufferSource(); s.buffer = NOISE; const fl = AC.createBiquadFilter(); fl.type = type;
  fl.frequency.setValueAtTime(f0, t); fl.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
  const g = AC.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(fl); fl.connect(g); g.connect(out || sfxG); s.start(t, Math.random()); s.stop(t + dur + 0.05);
}
const lastS = {};
const thr = (k, ms) => { const n = performance.now(); if (lastS[k] && n - lastS[k] < ms) return false; lastS[k] = n; return true; };
const SFX = {
  laser() { if (thr('l', 85)) tone(1800, 0.07, 'sawtooth', 0.018, 0.3); },
  boom(sz = 1) { if (thr('b' + (sz > 2 ? 1 : 0), 50)) { noise(0.4 + sz * 0.3, Math.min(0.6, 0.2 + sz * 0.12), 2500, 50); tone(120, 0.3 + sz * 0.2, 'sine', 0.25, 0.3); } },
  hit() { if (thr('h', 40)) tone(2400, 0.03, 'triangle', 0.03, 0.6); },
  gate(n) { tone(660 * Math.pow(1.06, Math.min(n, 12)), 0.12, 'square', 0.06, 1); tone(990 * Math.pow(1.06, Math.min(n, 12)), 0.18, 'square', 0.05, 1, 0.06); },
  hurt() { noise(0.5, 0.45, 1800, 80); tone(160, 0.4, 'sawtooth', 0.2, 0.4); },
  lock() { if (thr('lk', 50)) tone(1500, 0.05, 'square', 0.05); },
  missile() { if (thr('m', 60)) noise(0.3, 0.1, 3000, 500, 0, 'bandpass'); },
  boostOn() { noise(0.6, 0.18, 300, 5000, 0, 'bandpass'); },
  warn() { for (let i = 0; i < 3; i++) { tone(880, 0.35, 'sawtooth', 0.07, 0.7, i * 0.8); tone(660, 0.35, 'sawtooth', 0.07, 0.7, i * 0.8 + 0.4); } },
  mega() { noise(2.4, 0.8, 1800, 30); tone(60, 2, 'sine', 0.5, 0.3); },
  warp() { noise(3, 0.3, 200, 8000, 0, 'bandpass'); tone(80, 3, 'sawtooth', 0.1, 8); },
  start() { [392, 523, 784, 1047].forEach((f, i) => tone(f, 0.2, 'square', 0.06, 1, i * 0.07)); },
};
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
function music() {
  if (!AC) return;
  const spb = 60 / (bossOn ? 150 : 132) / 4;
  while (nextNoteT < AC.currentTime + 0.15) {
    const t = nextNoteT, s = stepI, i = s & 15, bar = (s >> 4) & 3, d = t - AC.currentTime;
    if (!muted && state !== 'over') {
      const roots = [40, 36, 43, 38], r = roots[bar];
      if (i % 4 === 0) { const o = AC.createOscillator(), g = AC.createGain(); o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.2); g.gain.setValueAtTime(0.75, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.22); o.connect(g); g.connect(musG); o.start(t); o.stop(t + 0.25); }
      if (i === 4 || i === 12) noise(0.2, 0.25, 3500, 1000, d, 'bandpass', musG);
      if (i % 2 === 1) noise(0.04, 0.07, 9000, 7000, d, 'highpass', musG);
      tone(mtof(r + (i % 4 === 3 ? 12 : 0)), 0.14, 'sawtooth', 0.07, 1, d, musG);
      if (i % 8 === 0) { tone(mtof(r + 24), 0.9, 'triangle', 0.025, 1, d, musG); tone(mtof(r + 31), 0.9, 'triangle', 0.02, 1, d, musG); }
      if (bossOn) { const arp = [0, 7, 12, 15]; tone(mtof(r + 36 + arp[i % 4]), 0.08, 'square', 0.02, 1, d, musG); }
    }
    nextNoteT += spb; stepI = (stepI + 1) % 64;
  }
}

/* ---------- 입력 ---------- */
const keys = {}, mouse = { x: 0, y: 0, active: false };
let isTouch = false, touchId = null, tlx = 0, tly = 0, touchBoost = false;
addEventListener('keydown', e => {
  initAudio();
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab'].includes(e.code)) e.preventDefault();
  keys[e.code] = true; if (e.repeat) return;
  if (e.code === 'KeyM') { muted = !muted; if (master) master.gain.value = muted ? 0 : 0.5; return; }
  if (state === 'title') { if (e.code === 'Enter' || e.code === 'Space') startGame(); return; }
  if (state === 'over') { if ((e.code === 'Enter' || e.code === 'Space') && overT > 1.2) startGame(); return; }
  if (e.code === 'KeyP' || e.code === 'Escape') { paused = !paused; return; }
  if (paused) { paused = false; return; }
  if (e.code === 'KeyE' || e.code === 'KeyQ' || e.code === 'KeyX') fireLock();
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; mouse.boost = false; if (state === 'play') paused = true; });
const boostBtn = () => ({ x: 80, y: VH - 110 }), lockBtn = () => ({ x: VW - 80, y: VH - 110 });
cvs.addEventListener('pointerdown', e => {
  initAudio();
  const sx = e.clientX / K, sy = e.clientY / K;
  if (e.pointerType === 'touch') isTouch = true;
  if (state === 'title') { startGame(); return; }
  if (state === 'over') { if (overT > 1.2) startGame(); return; }
  if (paused) { paused = false; return; }
  if (e.pointerType === 'touch') {
    const bb = boostBtn(), lb = lockBtn();
    if (Math.hypot(sx - bb.x, sy - bb.y) < 60) { touchBoost = e.pointerId; return; }
    if (Math.hypot(sx - lb.x, sy - lb.y) < 60) { fireLock(); return; }
    if (touchId == null) { touchId = e.pointerId; tlx = sx; tly = sy; }
  } else { mouse.active = true; mouse.x = sx; mouse.y = sy; if (e.button === 2) fireLock(); else mouse.boost = true; }
});
cvs.addEventListener('pointermove', e => {
  const sx = e.clientX / K, sy = e.clientY / K;
  if (e.pointerType === 'touch') {
    if (e.pointerId === touchId && player && state === 'play') { player.x = clamp(player.x + (sx - tlx) / (VW / 2) * BX * 1.6, -BX, BX); player.y = clamp(player.y - (sy - tly) / (VH / 2) * 4 * 1.6, BYmin, BYmax); player.tvx += (sx - tlx) * 0.5; tlx = sx; tly = sy; }
  } else { mouse.active = true; mouse.x = sx; mouse.y = sy; }
});
const pUp = e => { if (e.pointerId === touchId) touchId = null; if (e.pointerId === touchBoost) touchBoost = false; if (e.pointerType !== 'touch' && e.button !== 2) mouse.boost = false; };
cvs.addEventListener('pointerup', pUp); cvs.addEventListener('pointercancel', pUp);
cvs.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') paused = true; });

/* ---------- 상태 ---------- */
const PZ = 7, FAR = 280, BX = 6.2, BYmin = -3.0, BYmax = 3.6, FLOOR = -5.5;
let state = 'title', paused = false, gtime = 0, titleT = 0, overT = 0;
let player, objs = [], lasers = [], ebul = [], missiles = [], locks = [], p3 = [], p2 = [], texts = [], banners = [], dust = [];
let sector = 1, sectorT = 0, phase = 'run', phaseT = 0, spawnT = 1, pylonT = 0, boss = null, bossOn = false;
let spd = 55, f = 600, fovK = 1, camX = 0, camY = 0, camRoll = 0, scrollZ = 0, warp = 0;
let score = 0, dispScore = 0, hiScore = 0, distance = 0, kills = 0, gates = 0, gateCombo = 0, bestCombo = 0, newRecord = false;
let shake = 0, flashA = 0, flashCol = '#fff', hurtA = 0, freeze = 0, timeScale = 1, slowT = 0, slowV = 1, lockStock = 3, lockKills = 0;
try { hiScore = +localStorage.getItem('voidrunner_hi') || 0; } catch (e) {}
for (let i = 0; i < 140; i++) dust.push({ x: rand(-30, 30), y: rand(-5, 14), z: rand(2, FAR) });

function startGame() {
  SFX.start();
  state = 'play'; paused = false;
  player = { x: 0, y: 0, vx: 0, vy: 0, tvx: 0, hull: 100, boost: 60, boosting: false, fireT: 0, inv: 1.5, roll: 0, rollV: 0, dead: false, deadT: 0, hitT: 0, side: 1 };
  objs = []; lasers = []; ebul = []; missiles = []; locks = []; p3 = []; p2 = []; texts = []; banners = [];
  sector = 1; sectorT = 0; phase = 'run'; phaseT = 0; spawnT = 2; boss = null; bossOn = false;
  score = 0; dispScore = 0; distance = 0; kills = 0; gates = 0; gateCombo = 0; bestCombo = 0; newRecord = false; lockStock = 3; lockKills = 0;
  warp = 1.5; flashA = 0.7; flashCol = '#ffffff';
  banners.push({ type: 'sector', t: 0, dur: 3 });
}

/* ---------- 투영 ---------- */
function proj(x, y, z) { const s = f / z; return { x: cx + (x - camX) * s, y: cy - (y - camY) * s, s }; }

/* ---------- 파티클 ---------- */
function add3(o) { if (p3.length > 1500) return; o.max = o.life; o.vx = o.vx || 0; o.vy = o.vy || 0; o.vz = o.vz || 0; p3.push(o); }
function add2(o) { if (p2.length > 800) return; o.max = o.life; o.vx = o.vx || 0; o.vy = o.vy || 0; p2.push(o); }
function boom3(x, y, z, sz = 1, col = '#ff9a2e') {
  add3({ k: 'glow', x, y, z, size: 3 * sz, life: 0.3, color: '#fff3d0' });
  add3({ k: 'ring', x, y, z, size: 0.3, grow: 3.5 * sz, life: 0.45, color: col });
  for (let i = 0; i < 18 * sz; i++) { const a = Math.random() * TAU, b = Math.random() * TAU, s = rand(3, 14) * Math.sqrt(sz); add3({ k: 'spark', x, y, z, vx: Math.cos(a) * Math.cos(b) * s, vy: Math.sin(a) * Math.cos(b) * s, vz: Math.sin(b) * s, life: rand(0.3, 0.7), color: Math.random() < .5 ? '#ffd27a' : col }); }
  for (let i = 0; i < 6 * sz; i++) add3({ k: 'glow', x: x + rand(-0.6, 0.6) * sz, y: y + rand(-0.6, 0.6) * sz, z: z + rand(-0.6, 0.6), vx: rand(-2, 2), vy: rand(-2, 2), size: rand(0.8, 1.6) * sz, life: rand(0.4, 0.8), color: Math.random() < .5 ? col : '#ff5a1e' });
  for (let i = 0; i < 5 * sz; i++) add3({ k: 'debris', x, y, z, vx: rand(-8, 8), vy: rand(-8, 8), vz: rand(-8, 8), size: rand(0.15, 0.4) * sz, life: rand(0.8, 1.4), rot: Math.random() * TAU, vr: rand(-10, 10), color: theme().rock });
  shake = Math.max(shake, 2 + 2 * sz * Math.min(1, 40 / z));
  SFX.boom(sz);
}
function addText(x, y, s, col = '#fff', size = 18, dur = 0.9) { texts.push({ x, y, s, col, size, t: 0, dur }); }

/* ---------- 오브젝트 생성 ---------- */
function rockVerts() { const n = 11, v = []; for (let i = 0; i < n; i++) v.push(rand(0.75, 1.15)); return v; }
function spawnPattern() {
  const lv = sector + sectorT / 40;
  const opts = [['rocks', 3], ['gates', 2.6], ['wall', sectorT > 8 ? 1.4 : 0], ['fighters', sectorT > 4 ? 2 : 0.6], ['mines', lv > 1.4 ? 1.2 : 0.3]];
  let tot = opts.reduce((s, o) => s + o[1], 0), r = Math.random() * tot, pick = 'rocks';
  for (const o of opts) { r -= o[1]; if (r <= 0) { pick = o[0]; break; } }
  const z0 = FAR;
  if (pick === 'rocks') { const n = 4 + Math.floor(lv * 1.5); for (let i = 0; i < n; i++) objs.push({ t: 'rock', x: rand(-BX - 2, BX + 2), y: rand(BYmin - 0.5, BYmax + 0.5), z: z0 + rand(0, 70), r: rand(0.9, 2.1), hp: 3, rot: Math.random() * TAU, vr: rand(-2, 2), v: rockVerts(), flash: 0 }); }
  else if (pick === 'gates') { const n = 4, ph = Math.random() * TAU, ax = rand(2, 4.5), ay = rand(0.8, 2.2); for (let i = 0; i < n; i++) objs.push({ t: 'gate', x: Math.sin(ph + i * 0.7) * ax, y: 0.3 + Math.cos(ph + i * 0.9) * ay, z: z0 + i * 26, r: 2.3, spin: Math.random() * TAU }); }
  else if (pick === 'wall') objs.push({ t: 'wall', hx: rand(-3.5, 3.5), hy: rand(-1.5, 2), hw: Math.max(3.4, 5 - lv * 0.3), hh: Math.max(2.6, 3.6 - lv * 0.2), z: z0 });
  else if (pick === 'fighters') { const n = 2 + Math.min(3, Math.floor(lv)); for (let i = 0; i < n; i++) objs.push({ t: 'fighter', x: rand(-8, 8), y: rand(-1, 6), z: z0 + i * 10, hz: rand(42, 70), ox: rand(-BX, BX), oy: rand(-1, 3), hp: 4 + sector, age: 0, fireT: rand(1, 2), r: 1.3, flash: 0, ph: Math.random() * TAU }); }
  else if (pick === 'mines') { const n = 3 + Math.floor(lv); for (let i = 0; i < n; i++) objs.push({ t: 'mine', x: rand(-BX, BX), y: rand(BYmin, BYmax), z: z0 + i * 14, r: 0.9, hp: 2, rot: 0, flash: 0 }); }
}
function spawnBoss() {
  const hp = Math.round(55 * (1 + 0.45 * (sector - 1)));
  boss = { x: 0, y: 1.5, z: FAR + 40, tz: 72, t: 0, enter: 0, cores: [{ ox: -4.6, oy: -0.3, hp, max: hp }, { ox: 4.6, oy: -0.3, hp, max: hp }, { ox: 0, oy: 3.6, hp: Math.round(hp * 1.4), max: Math.round(hp * 1.4) }], fireT: 1.5, pat: 0, patT: 0, sa: 0, flash: 0, dying: 0, expT: 0 };
  bossOn = true;
}

/* ---------- 액션 ---------- */
function targetables() {
  const list = [];
  for (const o of objs) if ((o.t === 'rock' || o.t === 'fighter' || o.t === 'mine') && !o.dead && o.z > PZ + 4 && o.z < FAR * 0.85) list.push({ o, x: o.x, y: o.y, z: o.z });
  if (boss && boss.enter >= 1 && !boss.dying) boss.cores.forEach((c, i) => { if (c.hp > 0) list.push({ o: boss, core: i, x: boss.x + c.ox, y: boss.y + c.oy, z: boss.z }); });
  return list;
}
function fireLock() {
  const p = player; if (!p || p.dead || lockStock <= 0) return;
  const tl = targetables().sort((a, b) => (a.core != null ? 0 : a.z) - (b.core != null ? 0 : b.z)).slice(0, 6);
  if (!tl.length) { addText(VW / 2, VH * 0.62, 'NO TARGET', '#ff6a8a', 16); return; }
  lockStock--;
  tl.forEach((t, i) => {
    locks.push({ tgt: t, t: -i * 0.07, dur: 0.35 });
    setTimeout(() => { if (state !== 'play') return; missiles.push({ x: p.x + (i % 2 ? 1 : -1) * 1, y: p.y - 0.2, z: PZ, vx: (i % 2 ? 1 : -1) * rand(4, 8), vy: rand(2, 6), vz: 10, tgt: t, life: 3, smT: 0 }); SFX.missile(); }, 350 + i * 70);
  });
}
function hurt(dmg) {
  const p = player; if (p.dead || p.inv > 0) return;
  p.hull -= dmg; p.inv = 0.9; p.hitT = 0.4;

let last = performance.now();
function frame(now) {
  const rdt = Math.min(0.05, (now - last) / 1000); last = now;
